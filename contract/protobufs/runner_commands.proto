syntax = "proto3";


package runner_commands;

option java_package = "com.flezha.sdk.proto";
option java_multiple_files = true;
option java_outer_classname = "RunnerCommandsProto";

message CommandRequest {
    string reference_id = 1;

    oneof command {
        AssignRunnerId assign_runner_id = 2;
        ConnectSocket connect_socket = 3;
        AddOperator add_operator = 4;
        RemOperator rem_operator = 5;
        MigrationSerialization migration_serialization = 6;
        MigrationDeserialization migration_deserialization = 7;
        CellState cell_state = 8;
        RunnerDisconnect runner_disconnect = 9;
        OperatorMessage operator_message = 10;
        CellApplyState cell_apply_state = 11;
        RunnerShutdownNotification runner_shutdown_notification = 12;
        RunnerShutdownAck runner_shutdown_ack = 13;
        RestoreInitState restore_init_state = 14;
        RestoreInitStateResponse restore_init_state_response = 15;
        CompactCell compact_cell = 16;
        CompactCellResponse compact_cell_response = 17;
        CellMailboxStatus cell_mailbox_status = 18;
        Ping ping = 19;
        RunnerReconnected runner_reconnected = 20;
        ReassignRunnerId reassign_runner_id = 21;
        OperatorCompleted operator_completed = 22;
        StepsStop steps_stop = 23;
        CreditWindowInit credit_window_init = 24;
        CreditWindowAck credit_window_ack = 25;
        CreditGrant credit_grant = 26;
        ParkPayloadAck park_payload_ack = 27;
        TaskCommit task_commit = 28;
        TaskCommitResponse task_commit_response = 29;
        IterCommit iter_commit = 30;
        IterCommitResponse iter_commit_response = 31;
        IterPark iter_park = 32;
        UpdateFactories update_factories = 33;
        SpawnStepsRequest spawn_steps_request = 34;
        SpawnStepsResponse spawn_steps_response = 35;
        AdminRequest admin_request = 36;
        AdminResponse admin_response = 37;
        OperatorExited operator_exited = 38;
        ConnectRefused connect_refused = 39;
    }
}

// A failure in the error model's one shape (docs/errors.md): a stable `code`
// spelled family.snake, its `class`, a plain `message`, the `details` that
// message names as a JSON object (the encoding `AdminRequest.args` uses), and
// a `hint` naming the next command, empty when there is none.
message Error {
    string code = 1;
    string class = 2;
    string message = 3;
    string details_json = 4;
    string hint = 5;
}

// Controller -> SDK, the one frame a refused runner connect is answered with,
// written before the controller closes the stream, so the runner can report
// why rather than retrying a connection that will never be admitted.
message ConnectRefused {
    Error error = 1;
}

message CommandResponse {
    string reference_id = 1;
    string status = 2;
    repeated Error errors = 3;
    bytes raw_data = 4;
}

message AssignRunnerId {
    string runner_id = 1;
}

message ConnectSocket {
    uint32 sockets_count = 1;
}

message AddOperator {
    string operator_id = 1;
    string factory_id = 2;
    // Initial state per tasklet name, a JSON object, for both kinds: a
    // steps operator's tasklets take it as a flow operator's do, and a steps operator's input
    // is the messages on its entry channels, never this document.
    string init_values = 3;
    // How the class runs, as its runner announced it: "flow" or "steps".
    // The class itself decides; the SDK reads its own settings, not this.
    string run = 4;
    // Number of persisted Cells the Controller will ship RestoreInitState
    // for on this (re)bind. Non-zero only when re-binding a durable steps operator
    // operator that has WAL state on disk (crash-resume). A durable steps operator
    // driver holds its first Tasklet until this many Cell restores have
    // landed, so a resumed run reads persisted state instead of cold-starting.
    // 0 for a fresh spawn, a flow operator, or an opted-out steps operator one.
    uint32 resume_cell_count = 5;
    // Steps operator task-journal crash-resume (steps-task-journal): the instance's
    // committed task indexes + latest journaled handoff. Instance-scoped, so it
    // rides the bind itself rather than a per-Cell restore — a durable
    // steps class with no per-Cell state ships no RestoreInitState at all,
    // and would otherwise resume at iteration 0 on every wake.
    // Absent when the instance has no journal (fresh spawn, opted-out class,
    // flow operator) — the driver then keeps the re-run-from-top behaviour.
    TaskJournalState task_journal = 6;
    // Partitioned operators: this member's identity within its group. A
    // `partition_count` below 2 means unpartitioned — the whole key space is
    // this instance's, which is every operator that predates partitioning.
    uint32 partition_index = 7;
    uint32 partition_count = 8;
    // The inclusive key-group range (0..255) this member owns. Shipped
    // explicitly rather than derived from (index, count) so a rescale's
    // recomputed ranges — and a later weighted assignment — need no format
    // change. The SDK refuses a key hashing outside this range.
    uint32 key_group_from = 9;
    uint32 key_group_to = 10;
    // Inbox items the Controller forwards after this bind (the journaled,
    // undelivered tail of a durable loop). The loop's park-idle clock starts
    // only once they have arrived: forwarded after the bind under load, they
    // would otherwise reach a driver that has already parked and be dropped.
    uint32 inbox_tail_count = 11;
    // The controller parks a failed turn sent as `IterCommit.dead_letter`.
    // Without it a steps driver ends the instance on a failed turn, because
    // an older controller would journal the commit and drop the message.
    bool dead_letter_turns = 12;
}

// SDK -> Controller, as the CommandResponse raw_data of AddOperator.
// Carries the operator class's settings and SDK-side declarations (operator
// metadata) so the Controller resolves per-class capabilities without a
// parallel config channel: "run" ("flow" | "steps", with "each" and
// "on_failure" for steps), "durable" ("memory" | "local" | "remote"),
// "sleep_after_ms" (absent: the instance never sleeps), and for flow
// "exactly" = "effectively_once" with "ack" and "correction_ms". The
// Controller resolves absent/undecodable metadata to every default.
message AddOperatorResponse {
    map<string, string> metadata = 1;
}

message RemOperator {
    string operator_id = 1;
}

message MigrationSerialization {
    string operator_id = 1;
}

message MigrationDeserialization {
    string operator_id = 1;
    string factory_id = 2;
    bytes serialized_state = 3;
}

// Serialize live in-memory Cell state as JSON. Both selector fields are
// optional (empty = absent): absent selector covers every Tasklet of the
// Operator (the migration/handover shape), `tasklet` narrows to one
// Tasklet's Cells, `tasklet` + `cell_key` to one Cell. An
// `cell_key` without a `tasklet` is refused — a Cell key is unique
// only within its Tasklet.
message CellState {
    string operator_id = 1;
    string tasklet = 2;
    string cell_key = 3;
}

message RunnerDisconnect {
    // Terminal disconnect: the runner runs its graceful shutdown and then
    // exits NON-ZERO, so the orchestrator that owns process lifecycle
    // restarts it. Default (false) is the existing cooperative disconnect,
    // which leaves the process running and reconnectable. A zero exit would
    // read as a clean stop and the runner would not come back — which is
    // exactly the flap the terminal rung exists to end.
    bool terminal = 1;
    // Why, for the runner's own log. Never interpreted by the SDK.
    string reason = 2;
}

message OperatorMessage {
    string operator_id = 1;
    bytes payload = 2;
}

message OperatorMessageResponse {
    bytes payload = 1;
    Error error = 2;
}

// Inverse of CellState. Sent by the Controller to a Runner SDK to
// prime a freshly-spawned Operator's GenServer/struct state from a
// previously-captured `state_binary`. Round-trips with the same opaque
// SDK-internal serialization used by CellState. SDKs that do not
// implement Apply respond with status="error" and an error coded
// `state.apply_not_supported`.
message CellApplyState {
    string operator_id = 1;
    string factory_id = 2;
    bytes state_binary = 3;
}

// Sent by the SDK to the Controller on graceful shutdown (SIGTERM, Drop of
// the SDK handle, explicit disconnect()) for each currently-running
// Operator. Carries the Runner's freshest in-memory state binary so the
// Controller can overwrite Overwatch.state.snapshot before the next
// AddOperator reissue (see runner-controller-connection-healing
// capability).
//
// Direction is reversed compared to most CommandRequest variants: SDK -> Controller.
// Wire format reuses the same CommandRequest envelope and the
// "control_command" payload_id; the Controller's ControlChannel inspects the
// oneof tag to dispatch.
//
// Older Controllers that do not recognise this opcode skip it via Protox's
// unknown-field handling; older SDKs that do not emit it fall back to the
// periodic-snapshot freshness shipped by heal-connections-on-restart.
message RunnerShutdownNotification {
    string operator_id = 1;
    bytes serialized_state = 2;
}

// Controller's reply to RunnerShutdownNotification. Carries no state — its
// purpose is purely to unblock the SDK's bounded ack-wait so the SDK can
// proceed to exit. The Controller emits the ack as soon as the snapshot cast
// is enqueued on the Overwatch GenServer (not after the cast has been applied).
//
// Controller -> SDK direction at the wire level — same envelope as the
// notification. The SDK awaits this with a per-Operator 2 s timeout
// (parallelised across Operators) and exits regardless after the timeout.
message RunnerShutdownAck {
    string operator_id = 1;
}

// One serialized inter-tasklet handoff value: the payload bytes produced
// by the channel's byte codec, tagged with the producing channel id so a
// resume re-seeds through the same channel's decoder.
message TaskHandoffItem {
    uint32 channel_id = 1;
    bytes payload = 2;
}

// One Cell a stage (or an undo) ran: the effect records it wrote in the stage,
// `first_seq..=seq` on its WAL, and the plugin channels those records wrote
// on. Both seqs are absent when the Cell wrote no record. The Controller
// journals the stage only once every named record is durable, and releases
// exactly those records' outputs once the entry is.
message CommittedCell {
    bytes cell_id = 1;
    optional uint64 seq = 2;
    repeated string channels = 3;
    optional uint64 first_seq = 4;
}

// SDK -> Controller, at each tasklet barrier of a durable structured
// steps operator (steps-task-journal): tasklet `task_idx` completed
// forward on `cells_ran`, each naming the effect records it wrote in the
// stage, and released the serialized `handoff` batch. The Controller waits
// until every named record is durable on its Cell's writer, appends ONE
// `task_committed` entry to the instance's task-journal, fsyncs, replies
// TaskCommitResponse, and only then releases the named records' outputs; the
// driver starts the next tasklet after the successful reply. Direction is
// reversed like RunnerShutdownNotification: SDK -> Controller over the
// "control_command" payload_id. `iter` is the loop iteration, 0 for a
// single-pass chain.
//
// `compensating` marks the undo twin: the records a `compensate` hook wrote
// for the already-committed tasklet `task_idx`, journaled as a `compensated`
// entry. The per-cell compensation markers still decide which hooks run.
//
// `completes` / `result` carry the tasklet's `ctx.complete` request, so a
// crash before the iteration commits still ends the instance on resume.
message TaskCommit {
    string operator_id = 1;
    uint32 task_idx = 2;
    uint32 iter = 3;
    repeated CommittedCell cells_ran = 4;
    repeated TaskHandoffItem handoff = 5;
    reserved 6;
    bool compensating = 7;
    bool completes = 8;
    bytes result = 9;
    // Set on the root stage of a pass a timer firing opened, and on no other.
    optional TimerTrigger trigger = 10;
}

// The firing that opened a timer-fed pass: the Cell of the stage's tasklet,
// the timer's kind (`true` for event time) and its scheduled timestamp.
message TimerTrigger {
    string cell_key = 1;
    bool event_time = 2;
    uint64 scheduled_at = 3;
}

// Controller -> SDK reply to TaskCommit, emitted only AFTER the journal
// entry is durable (fsync). Carries the originating request's
// reference_id so the SDK wakes the blocked driver. A present `error`
// (journal write/fsync failure, oversized handoff) terminates the run
// abnormally through the existing terminal-error path.
message TaskCommitResponse {
    string operator_id = 1;
    uint32 task_idx = 2;
    Error error = 3;
}

// SDK -> Controller, at each iteration boundary of a looping durable
// structured steps operator (steps-durable-loop): iteration `iter`
// finished, having consumed the durable input log up to `consumed_offset` —
// the `flz.offset` of the input that seeded it, absent when it consumed none
// (0 is the log's first offset) — and released `handoff` as its terminal
// batch. The Controller appends `iter_committed(iter, consumed_offset)` to the
// task-journal, fsyncs, replies IterCommitResponse, and then reports the
// consumed offset into the input log's watermark. The
// driver enters iteration `iter + 1` only on the successful reply — a crash
// before it re-runs the whole iteration (at-least-once), never the ones below
// it.
//
// `completes` is set when a tasklet of the iteration called
// `ctx.complete(result)`: the instance ends with `result` once this commit is
// durable, and a crash after it still ends it on resume.
message IterCommit {
    string operator_id = 1;
    uint32 iter = 2;
    optional uint64 consumed_offset = 3;
    repeated TaskHandoffItem handoff = 4;
    bool completes = 5;
    bytes result = 6;
    // The entry channel whose chain the iteration ran; a resumed chained
    // loop feeds its carry back into that chain.
    string entry_channel = 7;
    // Set when the iteration's turn failed in a `per_input` keep-progress
    // loop: the controller parks the message at `consumed_offset` in the
    // dead-letter queue, journals `dead_lettered` instead of `iter_committed`,
    // and only then answers; the driver then undoes the turn and takes the
    // next message as iteration `iter + 1`. Sent only to a controller that set
    // `AddOperator.dead_letter_turns`.
    optional DeadLetter dead_letter = 8;
}

// The failure a dead-lettered turn ends on: the tasklet whose Cell failed,
// its attempts, the author's error text, and the Cell's key (empty for a
// declared Cell).
message DeadLetter {
    string tasklet = 1;
    uint32 attempts = 2;
    string error = 3;
    string cell_key = 4;
}

// Controller -> SDK reply to IterCommit, emitted only AFTER the journal entry
// is durable (fsync). Same reference_id / terminal-error contract as
// TaskCommitResponse.
message IterCommitResponse {
    string operator_id = 1;
    uint32 iter = 2;
    Error error = 3;
}

// SDK -> Controller. An instance of either kind whose class sleeps has been idle
// past the threshold (a steps operator at the committed boundary of iteration `iter`,
// a flow operator at `iter` 0): it asks to sleep WITHOUT a OperatorCompleted (this is
// not a terminal outcome). The Controller writes the instance's park record and
// evicts it from the runner; the registry keeps it `suspended` until a new
// input-log append, or the wake deadline, rehydrates it
// (durable-suspension). `wake_deadline_ms` is 0 when the operator
// declared no durable timer. `consumed_offset` is the highest input-log offset
// the run parked to the dead-letter queue unread, absent when none: consumed
// without a pass, so the Controller releases it rather than re-delivering it.
message IterPark {
    string operator_id = 1;
    uint32 iter = 2;
    uint64 wake_deadline_ms = 3;
    optional uint64 consumed_offset = 4;
}

// One journaled forward task commit, shipped back on crash-resume so the driver
// can rebuild `plan_compensation`'s per-iteration `committed` input from
// durable state (steps-durable-loop): tasklet `task_idx` of iteration `iter`
// completed forward on `cells_ran`.
message TaskCommittedTask {
    uint32 task_idx = 1;
    uint32 iter = 2;
    repeated bytes cells_ran = 3;
    bool completes = 4;
    bytes result = 5;
    optional TimerTrigger trigger = 6;
}

// What one committed tasklet of the in-flight iteration released, keyed by
// its task_idx (steps-branching). A tasklet tree re-seeds each uncommitted
// child branch from its own parent's edge, so the resume state carries every
// in-flight commit's handoff — not just the latest one's.
message TaskEdgeHandoff {
    uint32 task_idx = 1;
    repeated TaskHandoffItem handoff = 2;
}

// Committed task-journal state shipped back on crash-resume
// (steps-task-journal). `iter` is the iteration to resume at — the one after
// the highest journaled `iter_committed` (0 for a non-looping chain);
// `committed_task_idxs` are the tasklets already committed inside that
// still-in-flight iteration, which the driver skips, and `task_handoffs` what
// each of them released, which seeds their uncommitted children. `handoff` is
// the previous iteration's terminal batch, which re-seeds a handoff-chained
// loop. `committed_tasks` carries every forward task commit with its iteration
// (compensation planning), `consumed_offset` the input-log offset the last
// committed iteration consumed (absent when it consumed none). Where an
// instance sleeps is not the journal's: it rides no field here.
// `completed` / `result` are the last committed iteration's completion
// request: a resume ends the instance with `result` instead of waiting for
// input.
//
// `rewind_undo` carries the tasklets a rewind unwound that have not been
// compensated yet (steps-loop-rewind). The driver runs them through the
// ordinary compensation planner before resuming forward at `iter`, which the
// journal has already folded back to the rewound-to iteration. Each undo
// journals a `compensated` entry, so the list shrinks across a crash and
// re-planning never double-compensates. Empty = no rewind pending.
message TaskJournalState {
    repeated uint32 committed_task_idxs = 1;
    uint32 iter = 2;
    repeated TaskHandoffItem handoff = 3;
    repeated TaskCommittedTask committed_tasks = 4;
    optional uint64 consumed_offset = 5;
    reserved 6, 7;
    repeated TaskCommittedTask rewind_undo = 8;
    repeated TaskEdgeHandoff task_handoffs = 9;
    bool completed = 10;
    bytes result = 11;
    // The entry channel the last committed iteration named; empty before
    // any iteration committed.
    string entry_channel = 12;
    // The highest input-log offset the instance ever consumed, by an
    // iteration commit or an input it dead-lettered unread; absent when none.
    // The driver drops a re-forwarded input at or below it.
    optional uint64 released_offset = 13;
}

// Per-Cell state restore handshake: Controller ships latest snapshot
// bytes plus tail-WAL bytes, SDK applies them to the cell's State
// before any input is processed. See the per-cell state persistence design.
//
// `cell_id` is the structured byte identifier
// `[operator_class_len: u8][operator_class][tasklet_id_len: u8][tasklet_id]
//  [cell_key_len: u16 BE][cell_key]`. `change_log_bytes` is
// the tail of the WAL framed `[seq: u64 BE][len: u32 BE]
// [header: 16B][change_bytes][crc32: u32 BE]` records back-to-back.
message RestoreInitState {
    bytes cell_id = 1;
    bytes snapshot_bytes = 2;
    bytes change_log_bytes = 3;
    // Saga crash-resume (operator-saga): the Controller sets these
    // from the per-Cell compensation markers it persisted for a durable
    // steps operator. `has_compensation_intent` ⇒ this Cell's tasklet
    // completed forward and may need undo; `has_compensation_done` ⇒ its
    // compensation already ran (skip it on resume). Both false for a
    // flow operator or a steps operator one that never compensated.
    bool has_compensation_intent = 4;
    bool has_compensation_done = 5;
    // The highest seq the shipped state already covers — the snapshot's seq
    // when the change log is empty. The SDK re-arms the Cell's change seq
    // to `terminal_seq + 1`; deriving it from the change log alone restarted
    // a snapshot-only restore at 1 and the writer dropped the next changes
    // as duplicates.
    uint64 terminal_seq = 6;
    // The snapshot file's stored 16-byte header, so the SDK can resolve the
    // snapshot's `schema_version` the way it resolves a change record's.
    // Empty exactly when `snapshot_bytes` is empty.
    bytes snapshot_header = 7;
}

// SDK acknowledgement after applying a `RestoreInitState`. `terminal_seq`
// is the highest WAL seq folded into State; the Controller expects the next
// `cell_state_change` to carry `seq = terminal_seq + 1`.
message RestoreInitStateResponse {
    bytes cell_id = 1;
    uint64 terminal_seq = 2;
    // At least one record was migrated from an older schema version. The
    // Controller answers with the compaction it already knows how to drive,
    // so the next snapshot is written by the running version and the
    // migration is paid once rather than on every restore.
    bool migrated = 3;
}

// Controller-issued compaction request. The SDK clones the cell's
// `Self::State` under the sticky CAS, serializes it, and replies via
// `cell_state_snapshot` then `CompactCellResponse`.
message CompactCell {
    bytes cell_id = 1;
}

message CompactCellResponse {
    bytes cell_id = 1;
    uint64 snapshot_seq = 2;
    uint64 snapshot_bytes_size = 3;
}

// Back-pressure signal: the Controller's per-Cell WAL outbox is at the
// high watermark (`status = "full"`) or has drained below the low
// watermark (`status = "open"`). The SDK's per-Cell mailbox
// observer translates the signal into the channel's declared
// `OverflowPolicy`.
message CellMailboxStatus {
    bytes cell_id = 1;
    string status = 2;
}

// End-to-end control-channel health probe issued by the Controller before
// `AddOperator`. The SDK responds immediately with a `CommandResponse{status:
// "success", raw_data: PingResponse}`; the round-trip proves the
// control channel is bound, the SDK is listening, and the reply path is
// intact. SDKs without the handler MUST log and ignore the unknown variant
// (existing protobuf-decoder behaviour).
message Ping {
    string nonce = 1;
}

message PingResponse {
    string nonce = 1;
}

// SDK -> Controller, emitted as the FIRST frame on every newly-established
// control stream after `handle_reconnect` runs. Preserves the runner's
// identity across the reconnect so the Controller can compute a binding
// delta instead of re-issuing every operator. `reason` is one of
// `control_stream_broken | read_error | write_error | keepalive_timeout
// | controller_requested`. Old Controllers that do not recognise this
// variant silently skip it; new SDKs against an old Controller therefore
// degrade to the pre-change "re-issue everything" behaviour.
message RunnerReconnected {
    string previous_id = 1;
    string new_id = 2;
    string reason = 3;
}

// Controller -> SDK. Issued only when the Controller has reassigned the
// SDK's bindings to a different runner session during the disconnect
// window (i.e. `bindings_for_runner(previous_id)` is empty). The SDK
// updates its in-memory `runner_id` in place; subsequent
// `RunnerReconnected` emissions carry the new id.
message ReassignRunnerId {
    string new_id = 1;
}

// SDK -> Controller. Emitted by an instance when it reaches an exit trigger
// (chain complete, ctx.complete, loop terminal, duration, or external stop).
// `status` is "ok" on a steps run's clean completion, "completed" on a flow
// instance's (ctx.complete), "error" on failure (with `error` describing it),
// or "cancelled" on a cooperative external stop or a duration that elapsed;
// `result` carries the terminal result/error payload. The Controller drives
// the same stop/teardown path as an explicit stop (deregister-on-completion)
// so a finished steps operator is removed from the durable registry and
// never replayed on boot or misjudged by convergence. Direction is reversed
// like RunnerShutdownNotification: SDK -> Controller over the
// "control_command" payload_id; old Controllers ignore the unknown variant via
// Protox unknown-field handling.
message OperatorCompleted {
    string operator_id = 1;
    string status = 2;
    string error = 3;
    bytes result = 4;
    // 5 was `direct_outputs`, a count of the plugin-bound outputs an opted-out
    // instance wrote straight to the data stream. Nothing reads it: the
    // teardown flushes the runner's stream channels instead of counting, which
    // holds even when an output was lost rather than delivered.
    reserved 5;
}

// Controller -> SDK. Offers credit-grant flow control for the runner's
// state stream. `stream_id` is an opaque credit-session id minted fresh per
// stream attach — grants carry it, and a reconnect re-runs the handshake with
// a new id so grants in flight for a dead session are discardable by
// construction. `window_bytes` is the byte budget the SDK may have un-fsynced
// on the controller; `low_watermark_bytes` is the controller's grant-batching
// threshold (informational to the SDK). The SDK acknowledges by returning an
// encoded CreditWindowAck as the CommandResponse raw_data; a pre-credit SDK
// that does not recognise the variant never acks and keeps the legacy
// CellMailboxStatus behaviour.
message CreditWindowInit {
    string stream_id = 1;
    uint64 window_bytes = 2;
    uint64 low_watermark_bytes = 3;
}

// SDK -> Controller, as the CommandResponse raw_data of CreditWindowInit.
// Echoes the offered `stream_id`; on receipt the controller marks the
// session credit-speaking and starts enforcing the byte ledger.
message CreditWindowAck {
    string stream_id = 1;
}

// Controller -> SDK. Replenishes `bytes` of send credit for the session
// identified by `stream_id`. Minted only when appended state becomes durable
// (WAL fsync), batched by the controller's low watermark — never per record.
// The SDK discards a grant whose `stream_id` does not match its current
// credit session (stale grant from before a reconnect). One-way; the generic
// CommandResponse it solicits is ignored.
message CreditGrant {
    string stream_id = 1;
    uint64 bytes = 2;
}

// Controller -> SDK. Durable ack for a `park_payload` data-stream frame:
// the dead-letter entry identified by `park_id` is fsynced in the DLQ
// store, so the parked cell may drop the poison payload and advance.
// One-way; the generic CommandResponse it solicits is ignored.
message ParkPayloadAck {
    string park_id = 1;
}

// One declared operator factory: the controller-facing factory id plus a
// human-readable description, mirroring the connect init frame's factory
// entries.
message FactoryDecl {
    string id = 1;
    string description = 2;
    // The SDK language of the class registered under this id — the value the
    // SDK declares to the poll core as `class.sdk_lang` and stamps at byte 0
    // of every durable record it writes (1 Rust, 2 Java, 3 Elixir; the
    // allocation table of record is `flz_core::header`). The Controller places
    // an operator only on a runner advertising its factory's established
    // language, because the State/Change bodies below the shared envelope are
    // per-SDK. 0 (absent) is "unspecified" and never places.
    uint32 sdk_lang = 3;
    // How the class registered under this id runs, "flow" or "steps": the
    // class declares it, so no start names it. The Controller places a start
    // only on a runner advertising the factory's established run; empty
    // (absent) never places, and any other value is refused by name.
    string run = 4;
    // For "steps" only: the loop shape ("once", "per_input", "chained") and
    // the failure mode ("undo_all", "keep_progress").
    string each = 5;
    string on_failure = 6;
}

// SDK -> Controller. Ships the runner's FULL current factory set after a
// post-start define or remove (sdk-runner-entrypoint-redesign). Full-set
// semantics make delivery idempotent; the reconnect init frame remains the
// resync of record, so a lost frame self-heals. Fire-and-forget: the
// Controller does not ack (it gates no durability barrier — a stale
// placement fails at the SDK's AddOperator handler and convergence
// re-places). Direction is reversed like RunnerShutdownNotification:
// SDK -> Controller over the "control_command" payload_id; old Controllers
// ignore the unknown variant via Protox unknown-field handling.
message UpdateFactories {
    repeated FactoryDecl factories = 1;
}

// Controller -> SDK. Cooperative external stop for a steps operator
// (`flz operator stop`), distinct from the hard `RemOperator` teardown: the
// SDK trips its cancellation token, lets in-flight work unwind, runs any saga
// compensation, then emits the normal `OperatorCompleted` (status "cancelled")
// that drives the single teardown path. Rides the "control_command" payload_id
// like other CommandRequest variants; SDKs that do not recognise it skip it via
// the protobuf decoder (degrading to no cooperative stop).
message StepsStop {
    string operator_id = 1;
}

// SDK -> Controller. A tasklet asked for a steps instance
// (`ctx.spawn_steps`): spawn `factory_id` under `instance_id` if that id is
// free, otherwise apply `if_running`. An empty `instance_id` asks the
// Controller to generate one and always spawns, so `if_running` is ignored for
// it. The namespace is NOT carried — the
// Controller takes it from the control channel the request arrived on, which
// is what makes cross-namespace spawning impossible by construction rather
// than by validation. `payload` becomes the instance's first inbox frame on a
// spawn, or one more inbox frame on a delivery; empty means "spawn only".
// `if_running` is "deliver" (default; empty reads as deliver) or "error".
// Rides the "control_command" payload_id like the other SDK-initiated
// variants; old Controllers ignore it via Protox unknown-field handling, so
// the requester simply times out. `identity` names where the request came
// from: the requesting instance, the input-log offset its tasklet was taking,
// the call's position in that invocation, the factory and a hash of the
// payload. A re-run of the invocation sends the same identity, and the
// Controller resolves it to the operator the first request did. Empty when
// the request came from outside a tasklet invocation.
message SpawnStepsRequest {
    string instance_id = 1;
    string factory_id = 2;
    bytes payload = 3;
    string if_running = 4;
    string identity = 5;
}

// Controller -> SDK reply to SpawnStepsRequest, carrying the originating
// request's reference_id so the SDK wakes the requester's result handle.
// `outcome` is `spawned` or `delivered` when the request reached an
// instance, and empty when it was refused; `error` is the refusal, carrying the
// controller's own code (`operator.already_running`, `operator.factory_unknown`,
// `operator.factory_not_steps`, `quota.exceeded`, `authz.*`, ...), and is
// absent otherwise. `instance_id` is the id the request
// resolved to: the requester's own, or the generated one for a request that
// carried none (empty when nothing was started). The reply never faults the
// requesting tasklet — it only resolves its handle.
message SpawnStepsResponse {
    string outcome = 1;
    Error error = 2;
    string instance_id = 3;
}

// SDK -> Controller. Ordinary application code administering the namespace its
// connection proved: one frame for every verb, because the verb is data.
// `verb` names a function of the controller's published consumer surface as
// "<Module>.<function>" (for example "Operator.start"); `args` is a JSON array
// of that call's remaining arguments.
//
// There is NO namespace field and NO principal field, and that is the safety
// property rather than an omission: the Controller fills both from the control
// channel the request arrived on, so naming another namespace is unexpressible
// rather than validated. The namespace slot each verb declares is filled the
// same way. What the caller may reach follows from the role its principal is
// bound to, so an added verb needs no change here and no change in any shared
// binding.
//
// Rides the "control_command" payload_id like the other SDK-initiated
// variants; an old Controller ignores it via unknown-field handling, so the
// requester simply times out.
message AdminRequest {
    string verb = 1;
    string args = 2;
}

// Controller -> SDK reply to AdminRequest, carrying the originating request's
// reference_id so the SDK wakes the blocked caller. `result` is the published
// function's own answer as JSON; `error` is a refusal (policy, quota, a name
// that resolves to nothing) and is absent otherwise.
message AdminResponse {
    string result = 1;
    Error error = 2;
}

// SDK -> Controller, one-way, over the "control_command" payload_id: the
// process of operator instance `operator_id` exited abnormally, so the runner
// no longer hosts it. `reason` renders the exit reason for the log, the
// telemetry and the park reason; nothing branches on it. The runner sends it
// again on every new control stream until the Controller answers with
// `AddOperator` or `RemOperator` for the id.
message OperatorExited {
    string operator_id = 1;
    string reason = 2;
}
